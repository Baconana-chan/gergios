[package]
name = "ext4-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust ext4 filesystem parser — superblock, extent tree, htree, directory"

[lib]
crate-type = ["lib", "staticlib"]

[[bench]]
name = "superblock_bench"
harness = false

[[bench]]
name = "extent_bench"
harness = false

[[bench]]
name = "dir_bench"
harness = false

[[bench]]
name = "journal_bench"
harness = false

[[bench]]
name = "xattr_acl_quota_bench"
harness = false

[dependencies]
libc = "0.2"

[features]
default = []
# Enables the mkfs module (std::os::unix file I/O). The core parser stays no_std.
std = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
