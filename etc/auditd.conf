# auditd.conf — Audit Daemon Configuration
#
# This file configures the auditd daemon's runtime behavior.
# Syntax: key = value
# Lines starting with # are comments.

# Path to the audit log file.
log_path = /var/log/audit/audit.log

# Poll interval in milliseconds (how often auditd reads the kernel buffer).
# Default: 10000 (10 seconds)
poll_interval_ms = 10000

# Log rotation settings.
#
# rotate_size_mb: Rotate when the current log file exceeds this size.
#                  Default: 10 (megabytes). Set to 0 to disable size-based rotation.
rotate_size_mb = 10

# rotate_interval_s: Force rotation after this many seconds, regardless of size.
#                    Default: 3600 (1 hour). Set to 0 to disable time-based rotation.
rotate_interval_s = 3600

# max_days: Delete rotated log files older than this many days.
#           Default: 30 (days). Set to 0 to never delete old logs.
max_days = 30
