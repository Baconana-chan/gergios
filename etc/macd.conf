# /etc/macd.conf — MAC Reference Policy for GergiOS
#
# Phase 3.5: Comprehensive reference policy covering all system services.
#
# Rule format:
#   <allow|deny> <op> [from <label>] [to <label>]
#
#   op:     ALL, IPC_SEND, IPC_RECEIVE, FILE_ACCESS, PRIVCTL_SET_SYS,
#           DEVICE_BIND, PROC_FORK, PROC_EXEC, PROC_KILL, RAWIO
#   label:  service label from system.conf (e.g., vfs, pm, rs, init)
#           or ANY (matches any endpoint)
#
# Semantics: first matching rule wins. Default (no match): DENY.
#
# ============================================================================
# COMPATIBLE MODE (default)
# ============================================================================
# Allow everything — backward compatible with no MAC enforcement.
# Comment out 'allow ALL' below and uncomment the strict policy section
# to enable MAC enforcement.
allow ALL

# ============================================================================
# STRICT POLICY
# Uncomment the rules below and comment out 'allow ALL' above to enable.
# ============================================================================
#
# --------------------------------------------------------------------------
# 1. CORE SYSTEM SERVICES
# --------------------------------------------------------------------------
#
# RS — Reincarnation Server: manages all services.
# Needs full IPC to start/stop/control every service.
# allow PRIVCTL_SET_SYS from rs to ANY
# allow IPC_SEND from rs to ANY
# allow PROC_KILL from rs to ANY
#
# PM — Process Manager: manages processes (fork, exec, exit).
# Needs to communicate with VFS, VM, RS, and all user processes.
# allow IPC_SEND from pm to ANY
# allow PROC_FORK from pm to ANY
# allow PROC_EXEC from pm to ANY
# allow PROC_KILL from pm to ANY
#
# VM — Virtual Memory: manages address spaces.
# Needs full IPC for page fault handling and memory mapping.
# allow IPC_SEND from vm to ANY
#
# DS — Data Store: shared key-value store for all services.
# All services need to publish/retrieve data.
# allow IPC_SEND from ds to ANY
# allow IPC_SEND from ANY to ds
#
# SCHED — Scheduler: manages CPU time for all processes.
# allow IPC_SEND from sched to ANY
#
# VFS — Virtual File System: mediates all file operations.
# Talks to filesystem drivers, PM, VM, devman.
# allow IPC_SEND from vfs to mfs
# allow IPC_SEND from vfs to ext4
# allow IPC_SEND from vfs to ext2
# allow IPC_SEND from vfs to pfs
# allow IPC_SEND from vfs to isofs
# allow IPC_SEND from vfs to procfs
# allow IPC_SEND from vfs to hgfs
# allow IPC_SEND from vfs to ptyfs
# allow IPC_SEND from vfs to pm
# allow IPC_SEND from vfs to vm
# allow IPC_SEND from vfs to rs
# allow IPC_SEND from vfs to devman
# allow IPC_SEND from vfs to ds
# allow IPC_SEND from vfs to mib
# allow FILE_ACCESS from ANY to vfs
#
# MACD — MAC Policy Daemon: receives MAC check requests from all services.
# allow IPC_SEND from ANY to macd
#
# AUDITD — Audit Daemon: receives auditctl commands from user space,
# reads kernel audit buffer via SYS_AUDIT.
# allow IPC_SEND from ANY to auditd
#
# --------------------------------------------------------------------------
# 2. FILESYSTEM SERVICES
# --------------------------------------------------------------------------
#
# MFS, EXT4, EXT2, PFS — filesystem drivers.
# Only talk to VFS (+ VM for cache pages; PFS has no cache).
# allow IPC_SEND from mfs to vfs
# allow IPC_SEND from mfs to vm
# allow IPC_SEND from ext4 to vfs
# allow IPC_SEND from ext4 to vm
# allow IPC_SEND from ext2 to vfs
# allow IPC_SEND from ext2 to vm
# allow IPC_SEND from pfs to vfs
#
# PROCFS — process filesystem.
# allow IPC_SEND from procfs to vfs
# allow IPC_SEND from procfs to vm
#
# ISOFS — ISO 9660 filesystem.
# allow IPC_SEND from isofs to vfs
# allow IPC_SEND from isofs to vm
#
# HDFS — Host filesystem (VMware HGFS).
# allow IPC_SEND from hgfs to vfs
# allow IPC_SEND from hgfs to vm
#
# PTYFS — pseudo-terminal filesystem.
# allow IPC_SEND from ptyfs to vfs
# allow IPC_SEND from ptyfs to pty
# allow IPC_SEND from ptyfs to pm
#
# NTFS-3G — NTFS filesystem (user-started).
# allow IPC_SEND from ntfs-3g to vfs
#
# VND — vnode disk (loopback device).
# allow IPC_SEND from vnd to vfs
# allow IPC_SEND from vnd to vm
#
# FILTER — disk filter (e.g., encryption).
# allow IPC_SEND from filter to at_wini
#
# --------------------------------------------------------------------------
# 3. DEVICE DRIVERS
# --------------------------------------------------------------------------
#
# TTY — terminal driver.
# allow RAWIO from tty to ANY
# allow IPC_SEND from tty to pm
# allow IPC_SEND from tty to vfs
# allow IPC_SEND from tty to input
# allow IPC_SEND from tty to ds
#
# MEMORY — /dev/mem, /dev/null, etc.
# allow RAWIO from memory to ANY
# allow IPC_SEND from memory to ANY
#
# PCI — PCI configuration space access.
# allow RAWIO from pci to ANY
# allow IPC_SEND from pci to rs
# allow IPC_SEND from pci to ds
#
# ACPI — Advanced Configuration and Power Interface.
# allow RAWIO from acpi to ANY
#
# AHCI — SATA AHCI controller.
# allow RAWIO from ahci to ANY
# allow IPC_SEND from ahci to devman
#
# VIRTIO_BLK — virtio block device.
# allow RAWIO from virtio_blk to ANY
# allow IPC_SEND from virtio_blk to devman
#
# AT_WINI — legacy ATA/IDE controller.
# allow RAWIO from at_wini to ANY
# allow IPC_SEND from at_wini to filter
#
# FLOPPY — floppy disk driver.
# allow RAWIO from floppy to ANY
# allow IPC_SEND from floppy to devman
#
# PCKBD — PS/2 keyboard/mouse.
# allow RAWIO from pckbd to ANY
# allow IPC_SEND from pckbd to input
#
# MMC — MMC/SD card controller.
# allow RAWIO from mmc to ANY
#
# EMMC — eMMC device.
# allow RAWIO from emmc to ANY
#
# FB — framebuffer device.
# allow RAWIO from fb to ANY
#
# DEVMAN — device manager. Handles device bind/unbind.
# allow IPC_SEND from rs to devman
# allow IPC_SEND from vfs to devman
# allow IPC_SEND from ahci to devman
# allow IPC_SEND from virtio_blk to devman
# allow IPC_SEND from floppy to devman
#
# Device binding — only RS can initiate device binds;
# devman forwards to the actual driver.
# allow DEVICE_BIND from rs to ANY
# allow DEVICE_BIND from devman to ahci
# allow DEVICE_BIND from devman to virtio_blk
# allow DEVICE_BIND from devman to at_wini
# allow DEVICE_BIND from devman to floppy
#
# FB — framebuffer device. Talks to I2C devices for display control.
# allow RAWIO from fb to ANY
# allow IPC_SEND from fb to cat24c256
# allow IPC_SEND from fb to tda19988
#
# CLOCK — Real-time clock drivers.
# allow RAWIO from readclock.drv to ANY
# allow RAWIO from tps65950 to ANY
#
# I2C — I2C bus devices.
# allow IPC_SEND from cat24c256 to i2c
# allow IPC_SEND from tda19988 to i2c
# allow IPC_SEND from tps65217 to i2c
# allow IPC_SEND from tps65950 to i2c
# allow RAWIO from tps65217 to ANY
#
# --------------------------------------------------------------------------
# 4. USER / SERVICE PROCESSES
# --------------------------------------------------------------------------
#
# INIT — first user process.
# allow IPC_SEND from init to pm
# allow IPC_SEND from init to vfs
# allow IPC_SEND from init to rs
# allow IPC_SEND from init to vm
#
# LOG — system log daemon.
# allow IPC_SEND from log to vfs
# allow IPC_SEND from log to rs
#
# MIB — Management Information Base (sysctl).
# allow IPC_SEND from mib to ANY
# allow IPC_SEND from ANY to mib
#
# IS — Input server.
# allow IPC_SEND from is to vm
# allow IPC_SEND from is to tty
#
# INPUT — input event hub.
# allow IPC_SEND from input to tty
# allow IPC_SEND from input to ds
#
# FBD — framebuffer daemon.
# allow IPC_SEND from fbd to vfs
#
# PTY — pseudo-terminal master.
# allow IPC_SEND from pty to vfs
# allow IPC_SEND from pty to ptyfs
#
# KLKM — kernel module loader.
# allow IPC_SEND from klkm to vfs
# allow IPC_SEND from klkm to rs
#
# EDFICTL — EDF scheduling control.
# allow IPC_SEND from edfictl to ANY
#
# --------------------------------------------------------------------------
# 5. FINAL RULES
# --------------------------------------------------------------------------
#
# Deny anything that doesn't match an explicit allow rule.
# deny ALL
#
# Allow all remaining IPC for system services (backward compat).
# Keep enabled during transition to strict mode.
# allow IPC_SEND from rs to ANY
# allow IPC_SEND from pm to ANY
# allow IPC_SEND from vfs to ANY
# allow IPC_SEND from vm to ANY
# allow IPC_SEND from ds to ANY
# allow IPC_SEND from sched to ANY
# allow IPC_SEND from mib to ANY
# allow IPC_SEND from edfictl to ANY
# allow IPC_SEND from klkm to ANY
# allow IPC_SEND from auditd to ANY
#
# Allow all remaining operations for all services (compat).
# allow ALL
