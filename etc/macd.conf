# /etc/macd.conf — MAC Policy Configuration
#
# Rule format:
#   <allow|deny> <op> [from <label>] [to <label>]
#
#   op:     ALL, IPC_SEND, IPC_RECEIVE, FILE_ACCESS, PRIVCTL_SET_SYS,
#           DEVICE_BIND, PROC_FORK, PROC_EXEC, PROC_KILL, RAWIO
#   label:  service label from system.conf (e.g., vfs, pm, rs, init, vm, ds)
#           or ANY (matches any endpoint)
#
# Semantics: first matching rule wins.
# Default (no match): DENY (fail-closed).
#   → Always include an 'allow ALL' rule at the end for compat mode.
#

# ============================================================================
# Compatible default: allow everything.
# Remove or comment out the line below to enable MAC enforcement.
# ============================================================================
allow ALL

# ============================================================================
# Example restrictive policy (uncomment to test):
# ============================================================================
#
# # 1. Only RS can set system privileges.
# allow PRIVCTL_SET_SYS from rs to ANY
# deny  PRIVCTL_SET_SYS from ANY to ANY
#
# # 2. Only VFS/PM/RS/VM can send IPC freely; deny IPC from init to VFS.
# deny  IPC_SEND from init to vfs
# deny  IPC_SEND from init to mfs
# allow IPC_SEND from ANY to ANY
#
# # 3. Deny all file access by untrusted services (default DAC still applies).
# deny  FILE_ACCESS from init to mfs
# allow FILE_ACCESS from ANY to ANY
#
# # 4. Allow all remaining operations.
# allow ALL
